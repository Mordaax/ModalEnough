[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selective-multimodal"
version = "0.3.0"
description = "Video review sentiment with on-demand text, audio and frame acquisition"
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "numpy>=1.24", "scikit-learn>=1.4", "matplotlib>=3.8", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.12", "black>=25", "mypy>=1.15"]
video = ["torch>=2.9,<3", "transformers==4.57.6", "accelerate>=1.2,<2", "faster-whisper>=1.1,<2", "soundfile>=0.13,<1", "librosa>=0.11,<1", "anthropic>=0.70,<1", "httpx>=0.28,<1", "bitsandbytes>=0.48,<1", "num2words>=0.5"]

[project.scripts]
selective-multimodal = "selective_multimodal.cli:main"
modalenough = "selective_multimodal.video.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
