[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selective-multimodal"
version = "0.1.0"
description = "Auditable budgeted acquisition over cached multimodal features"
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "numpy>=1.24", "scikit-learn>=1.4", "matplotlib>=3.8", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
selective-multimodal = "selective_multimodal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
