name: checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,video]'
      - run: python -m pytest -q
      - name: CLI static checks
        shell: bash
        run: |
          files="src/selective_multimodal/video/config.py src/selective_multimodal/video/storage.py src/selective_multimodal/video/reports.py src/selective_multimodal/video/jobs.py src/selective_multimodal/video/diagnostics.py src/selective_multimodal/video/cli.py"
          python -m black --check $files tests/test_video_tool.py
          python -m ruff check --isolated --target-version py311 --select E4,E7,E9,F,I,UP,BLE,SIM,TRY,RUF --ignore TRY003,TRY301 $files tests/test_video_tool.py
          python -m mypy --strict --follow-imports=skip $files
      - run: modalenough --version
      - run: modalenough batch --help
      - run: python -m selective_multimodal.cli reproduce --config configs/synthetic.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-results-${{ matrix.os }}
          path: runs/demo/
